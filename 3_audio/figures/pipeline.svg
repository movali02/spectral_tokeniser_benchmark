<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A94A3"/></marker></defs><rect width="1000" height="470" fill="#FFFFFF" rx="10"/><text x="24" y="34" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="start">Audio tokeniser: read the spectrum as a spectrogram with Step-Audio-2-mini</text><rect x="24" y="76" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#C9CED6" stroke-width="1.2"/><text x="104.0" y="107.0" font-size="15" fill="#1F2933" font-weight="bold" text-anchor="middle">QM9S spectrum</text><text x="104.0" y="125.0" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle">IR + Raman, 3,501 points</text><rect x="214" y="76" width="190" height="70" rx="8" fill="#FBE9DE" stroke="#E9B79A" stroke-width="1.2"/><text x="309.0" y="98.0" font-size="15" fill="#1F2933" font-weight="bold" text-anchor="middle">Sliding window</text><text x="309.0" y="116.0" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle">to a [128, T] array</text><text x="309.0" y="132.0" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle">new step</text><rect x="434" y="76" width="190" height="70" rx="8" fill="#E3F2EC" stroke="#6DB59A" stroke-width="1.2"/><text x="529.0" y="107.0" font-size="15" fill="#1F2933" font-weight="bold" text-anchor="middle">Audio encoder</text><text x="529.0" y="125.0" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle">frozen, T ÷ 4</text><rect x="654" y="76" width="160" height="70" rx="8" fill="#E3F2EC" stroke="#6DB59A" stroke-width="1.2"/><text x="734.0" y="107.0" font-size="15" fill="#1F2933" font-weight="bold" text-anchor="middle">Adaptor</text><text x="734.0" y="125.0" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle">trained, T ÷ 2</text><path d="M184,111 L212,111" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><path d="M404,111 L432,111" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><path d="M624,111 L652,111" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><text x="870" y="106" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="middle">102 tokens</text><text x="870" y="124" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle">per spectrum</text><rect x="24" y="236" width="160" height="70" rx="8" fill="#ECEAFB" stroke="#A39CE0" stroke-width="1.2"/><text x="104.0" y="267.0" font-size="15" fill="#1F2933" font-weight="bold" text-anchor="middle">components_v3</text><text x="104.0" y="285.0" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle">text, unchanged</text><rect x="214" y="236" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#C9CED6" stroke-width="1.2"/><text x="309.0" y="267.0" font-size="15" fill="#1F2933" font-weight="bold" text-anchor="middle">Text tokenizer</text><text x="309.0" y="285.0" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle">Step-Audio's own</text><rect x="434" y="236" width="300" height="70" rx="8" fill="#E3F2EC" stroke="#6DB59A" stroke-width="1.2"/><text x="584.0" y="267.0" font-size="15" fill="#1F2933" font-weight="bold" text-anchor="middle">Qwen2.5-7B LLM</text><text x="584.0" y="285.0" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle">LoRA r16 (196 layers), 3 epochs</text><rect x="764" y="236" width="212" height="70" rx="8" fill="#2E3338" stroke="#2E3338" stroke-width="1.2"/><text x="870.0" y="267.0" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">SMILES</text><text x="870.0" y="285.0" font-size="12" fill="#D7DCE2" font-weight="normal" text-anchor="middle">same metrics as the strings</text><path d="M184,271 L212,271" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><path d="M404,271 L432,271" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><path d="M734,271 L762,271" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><path d="M734,146 L734,186 L640,186 L640,234" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><text x="746" y="180" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="start" font-style="italic">audio tokens go where the prompt has</text><text x="746" y="194" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="start" font-style="italic">&lt;audio_start&gt; … &lt;audio_end&gt;</text><rect x="24" y="334" width="520" height="30" rx="4" fill="#FBE9DE" stroke="none" stroke-width="1.2"/><text x="284.0" y="354" font-size="15" fill="#1F2933" font-weight="bold" text-anchor="middle">The view: a window of 128 points slides along the spectrum</text><rect x="40" y="378" width="90" height="50" rx="2" fill="none" stroke="#C4420E" stroke-width="1.0"/><rect x="56" y="381" width="90" height="50" rx="2" fill="none" stroke="#8A94A3" stroke-width="1.0"/><rect x="72" y="384" width="90" height="50" rx="2" fill="none" stroke="#8A94A3" stroke-width="1.0"/><rect x="88" y="387" width="90" height="50" rx="2" fill="none" stroke="#8A94A3" stroke-width="1.0"/><rect x="104" y="390" width="90" height="50" rx="2" fill="none" stroke="#8A94A3" stroke-width="1.0"/><rect x="120" y="393" width="90" height="50" rx="2" fill="none" stroke="#8A94A3" stroke-width="1.0"/><rect x="136" y="396" width="90" height="50" rx="2" fill="none" stroke="#8A94A3" stroke-width="1.0"/><text x="272" y="392" font-size="12" fill="#1F2933" font-weight="normal" text-anchor="start">frame t = points 2t to 2t + 127</text><text x="272" y="410" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="start">(2 cm⁻¹ per point, window = 256 cm⁻¹)</text><text x="272" y="430" font-size="12" fill="#1F2933" font-weight="normal" text-anchor="start">a peak at point p sits in channel p − 2t,</text><text x="272" y="448" font-size="12" fill="#1F2933" font-weight="normal" text-anchor="start">so each peak draws a diagonal line</text><rect x="570" y="334" width="406" height="30" rx="4" fill="#FBE9DE" stroke="none" stroke-width="1.2"/><text x="773.0" y="354" font-size="15" fill="#1F2933" font-weight="bold" text-anchor="middle">Arms (same molecules as the strings)</text><text x="586" y="390" font-size="12" fill="#1F2933" font-weight="bold" text-anchor="start">S_on</text><text x="680" y="390" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="start">string with mode labels, no audio</text><text x="586" y="410" font-size="12" fill="#1F2933" font-weight="bold" text-anchor="start">AUD</text><text x="680" y="410" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="start">audio only</text><text x="586" y="430" font-size="12" fill="#1F2933" font-weight="bold" text-anchor="start">S_on_AUD</text><text x="680" y="430" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="start">string with mode labels + audio</text><text x="586" y="450" font-size="12" fill="#1F2933" font-weight="bold" text-anchor="start">S_off_AUD</text><text x="680" y="450" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="start">string without mode labels + audio</text></svg>