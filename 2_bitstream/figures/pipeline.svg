<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A94A3"/></marker></defs><rect width="1000" height="640" fill="#FFFFFF" rx="10"/><text x="24" y="34" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="start">Bitstream: every field gets a fixed group of bits; a diffusion model generates the SMILES bits</text><rect x="24" y="52" width="952" height="30" rx="4" fill="#FBE9DE" stroke="none" stroke-width="1.2"/><text x="500.0" y="72" font-size="15" fill="#1F2933" font-weight="bold" text-anchor="middle">1. One example = 627 tokens of 12 bits: 604 for the spectrum, 23 for the SMILES (5,570 bits carry data, the rest is padding)</text><rect x="24" y="94" width="380" height="52" rx="8" fill="#ECEAFB" stroke="#A39CE0" stroke-width="1.2"/><text x="214.0" y="116.0" font-size="14" fill="#1F2933" font-weight="bold" text-anchor="middle">IR peaks</text><text x="214.0" y="134.0" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle">35 slots</text><rect x="420" y="94" width="250" height="52" rx="8" fill="#ECEAFB" stroke="#A39CE0" stroke-width="1.2"/><text x="545.0" y="116.0" font-size="14" fill="#1F2933" font-weight="bold" text-anchor="middle">Raman peaks</text><text x="545.0" y="134.0" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle">17 slots</text><rect x="686" y="94" width="290" height="52" rx="8" fill="#E3F2EC" stroke="#6DB59A" stroke-width="1.2"/><text x="831.0" y="116.0" font-size="14" fill="#1F2933" font-weight="bold" text-anchor="middle">SMILES</text><text x="831.0" y="134.0" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle">23 tokens</text><text x="347.0" y="166" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle" font-style="italic">clean prefix: the model reads it, never changes it</text><text x="831" y="166" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle" font-style="italic">what the model generates</text><text x="24" y="196" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="start">Each peak slot, in bits:</text><rect x="200" y="180" width="70" height="30" rx="5" fill="#ECEAFB" stroke="#A39CE0" stroke-width="1.2"/><text x="235.0" y="200" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="middle">12</text><text x="235.0" y="226" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle">pos</text><rect x="276" y="180" width="70" height="30" rx="5" fill="#ECEAFB" stroke="#A39CE0" stroke-width="1.2"/><text x="311.0" y="200" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="middle">12</text><text x="311.0" y="226" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle">lo</text><rect x="352" y="180" width="70" height="30" rx="5" fill="#ECEAFB" stroke="#A39CE0" stroke-width="1.2"/><text x="387.0" y="200" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="middle">12</text><text x="387.0" y="226" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle">hi</text><rect x="428" y="180" width="70" height="30" rx="5" fill="#ECEAFB" stroke="#A39CE0" stroke-width="1.2"/><text x="463.0" y="200" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="middle">7</text><text x="463.0" y="226" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle">int</text><rect x="504" y="180" width="70" height="30" rx="5" fill="#ECEAFB" stroke="#A39CE0" stroke-width="1.2"/><text x="539.0" y="200" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="middle">3</text><text x="539.0" y="226" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle">bin</text><rect x="580" y="180" width="66" height="30" rx="5" fill="#FDF3E3" stroke="#E3B77A" stroke-width="1.2"/><text x="613.0" y="200" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="middle">9</text><text x="613.0" y="226" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle">3 atoms</text><rect x="652" y="180" width="66" height="30" rx="5" fill="#FDF3E3" stroke="#E3B77A" stroke-width="1.2"/><text x="685.0" y="200" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="middle">3</text><text x="685.0" y="226" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle">site</text><rect x="724" y="180" width="66" height="30" rx="5" fill="#FDF3E3" stroke="#E3B77A" stroke-width="1.2"/><text x="757.0" y="200" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="middle">4</text><text x="757.0" y="226" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle">motion</text><rect x="796" y="180" width="66" height="30" rx="5" fill="#FDF3E3" stroke="#E3B77A" stroke-width="1.2"/><text x="829.0" y="200" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="middle">2</text><text x="829.0" y="226" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle">phase</text><rect x="868" y="180" width="66" height="30" rx="5" fill="#FDF3E3" stroke="#E3B77A" stroke-width="1.2"/><text x="901.0" y="200" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="middle">2</text><text x="901.0" y="226" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle">ncomp</text><text x="390.0" y="246" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle" font-style="italic">from the spectrum</text><text x="760.0" y="246" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle" font-style="italic">mode label (from the DFT Hessian)</text><rect x="24" y="266" width="466" height="30" rx="4" fill="#FBE9DE" stroke="none" stroke-width="1.2"/><text x="257.0" y="286" font-size="15" fill="#1F2933" font-weight="bold" text-anchor="middle">2. Training</text><rect x="40" y="316" width="130" height="46" rx="8" fill="#C4420E" stroke="#C4420E" stroke-width="1.2"/><text x="105.0" y="344.0" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Spectrum bits</text><rect x="40" y="392" width="130" height="46" rx="8" fill="#2E3338" stroke="#2E3338" stroke-width="1.2"/><text x="105.0" y="420.0" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">True SMILES bits</text><rect x="196" y="392" width="92" height="46" rx="8" fill="#FFFFFF" stroke="#C9CED6" stroke-width="1.2"/><text x="242.0" y="411.0" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="middle">Add noise</text><text x="242.0" y="429.0" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle">σ 0.002 to 80</text><rect x="316" y="316" width="156" height="122" rx="8" fill="#C9CED6" stroke="#C9CED6" stroke-width="1.2"/><text x="394.0" y="364.0" font-size="14" fill="#1F2933" font-weight="bold" text-anchor="middle">Transformer</text><text x="394.0" y="382.0" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle">41M parameters,</text><text x="394.0" y="398.0" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle">from scratch</text><path d="M170,339 L314,339" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><path d="M170,415 L194,415" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><path d="M288,415 L314,415" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><rect x="316" y="462" width="156" height="40" rx="8" fill="#2E3338" stroke="#2E3338" stroke-width="1.2"/><text x="394.0" y="478.0" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">P(bit = 1)</text><text x="394.0" y="496.0" font-size="11" fill="#D7DCE2" font-weight="normal" text-anchor="middle">for each SMILES bit</text><path d="M394,438 L394,460" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><rect x="196" y="462" width="92" height="40" rx="8" fill="#FFFFFF" stroke="#C9CED6" stroke-width="1.2"/><text x="242.0" y="478.0" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="middle">Loss</text><text x="242.0" y="496.0" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle">BCE × w(σ)</text><path d="M316,482 L290,482" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><path d="M105,438 L105,482 L194,482" fill="none" stroke="#8A94A3" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ah)"/><text x="110" y="522" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="start" font-style="italic">compared with the true bits</text><rect x="510" y="266" width="466" height="30" rx="4" fill="#FBE9DE" stroke="none" stroke-width="1.2"/><text x="743.0" y="286" font-size="15" fill="#1F2933" font-weight="bold" text-anchor="middle">3. Sampling (inference)</text><rect x="526" y="316" width="140" height="46" rx="8" fill="#C4420E" stroke="#C4420E" stroke-width="1.2"/><text x="596.0" y="344.0" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">New spectrum</text><rect x="686" y="316" width="150" height="46" rx="8" fill="#2E3338" stroke="#2E3338" stroke-width="1.2"/><text x="761.0" y="335.0" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Pure noise</text><text x="761.0" y="353.0" font-size="11" fill="#D7DCE2" font-weight="normal" text-anchor="middle">SMILES bits, σ = 80</text><rect x="522" y="380" width="446" height="92" rx="8" fill="none" stroke="#8A94A3" stroke-width="1.2" stroke-dasharray="5 4"/><text x="960" y="396" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="end" font-style="italic">repeat 128 times, σ from 80 to 0.08 (DDIM)</text><rect x="536" y="410" width="150" height="46" rx="8" fill="#C9CED6" stroke="#C9CED6" stroke-width="1.2"/><text x="611.0" y="438.0" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="middle">Transformer</text><rect x="706" y="410" width="110" height="46" rx="8" fill="#2E3338" stroke="#2E3338" stroke-width="1.2"/><text x="761.0" y="438.0" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">P(bit = 1)</text><rect x="836" y="410" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#C9CED6" stroke-width="1.2"/><text x="896.0" y="429.0" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="middle">Move bits</text><text x="896.0" y="447.0" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle">towards P</text><path d="M596,362 L596,408" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><path d="M761,362 L761,386 L650,386 L650,408" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><path d="M686,433 L704,433" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><path d="M816,433 L834,433" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><rect x="536" y="496" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#C9CED6" stroke-width="1.2"/><text x="611.0" y="515.0" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="middle">Threshold</text><text x="611.0" y="533.0" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle">bit = 1 if P &gt; 0.5</text><rect x="706" y="496" width="250" height="46" rx="8" fill="#E3F2EC" stroke="#6DB59A" stroke-width="1.2"/><text x="831.0" y="515.0" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="middle">Decode 23 symbols to SMILES</text><text x="831.0" y="533.0" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="middle">RDKit check, then the string metrics</text><path d="M896,456 L896,476 L611,476 L611,494" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><path d="M686,519 L704,519" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><text x="24" y="584" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="start">Base code: CoBit (Batzolis et al., BitstreamDiffusion). Same QM9S molecules, splits and metrics as the strings;</text><text x="24" y="602" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="start">numbers are quantised and written in plain binary. Each noisy SMILES bit is scaled by 1/√(σ² + 0.25); the spectrum bits are not.</text><text x="24" y="620" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="start">w(σ) = 4 + 1/σ² (EDM weighting): a mistake at low noise costs more than one at high noise.</text></svg>