<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A94A3"/></marker></defs><rect width="1000" height="430" fill="#FFFFFF" rx="10"/><text x="24" y="34" font-size="17" fill="#1F2933" font-weight="bold" text-anchor="start">Strings: write the same peaks as text in four ways, fine-tune one LLM per arm</text><rect x="24" y="120" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#C9CED6" stroke-width="1.2"/><text x="99.0" y="151.0" font-size="15" fill="#1F2933" font-weight="bold" text-anchor="middle">QM9S molecule</text><text x="99.0" y="169.0" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle">DFT IR + Raman</text><rect x="204" y="120" width="160" height="70" rx="8" fill="#FBE9DE" stroke="#E9B79A" stroke-width="1.2"/><text x="284.0" y="142.0" font-size="15" fill="#1F2933" font-weight="bold" text-anchor="middle">Peak list</text><text x="284.0" y="160.0" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle">SpectraLLM's peak finder</text><text x="284.0" y="176.0" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle">same for every arm</text><path d="M174,155 L202,155" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><text x="542.0" y="70" font-size="14" fill="#5F6B7A" font-weight="bold" text-anchor="middle">Text prompt (4 arms)</text><rect x="392" y="82" width="300" height="36" rx="6" fill="#FFFFFF" stroke="#C9CED6" stroke-width="1.2"/><text x="404" y="105" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="start">A_native</text><text x="682" y="105" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="end">SpectraLLM pipeline, exactly</text><rect x="392" y="126" width="300" height="36" rx="6" fill="#FFFFFF" stroke="#C9CED6" stroke-width="1.2"/><text x="404" y="149" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="start">A</text><text x="682" y="149" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="end">SpectraLLM layout, IR axis corrected</text><rect x="392" y="170" width="300" height="36" rx="6" fill="#ECEAFB" stroke="#A39CE0" stroke-width="1.2"/><text x="404" y="193" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="start">B_modes_off</text><text x="682" y="193" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="end">components_v3 (23 fields)</text><rect x="392" y="214" width="300" height="36" rx="6" fill="#ECEAFB" stroke="#A39CE0" stroke-width="1.2"/><text x="404" y="237" font-size="13" fill="#1F2933" font-weight="bold" text-anchor="start">B_modes_on</text><text x="682" y="237" font-size="11" fill="#5F6B7A" font-weight="normal" text-anchor="end">components_v3 + mode label per peak</text><path d="M364,155 L390,155" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><rect x="718" y="120" width="132" height="70" rx="8" fill="#E3F2EC" stroke="#6DB59A" stroke-width="1.2"/><text x="784.0" y="151.0" font-size="15" fill="#1F2933" font-weight="bold" text-anchor="middle">Qwen3-8B</text><text x="784.0" y="169.0" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle">LoRA r16, 3 epochs</text><path d="M692,155 L716,155" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><rect x="872" y="120" width="104" height="70" rx="8" fill="#2E3338" stroke="#2E3338" stroke-width="1.2"/><text x="924.0" y="151.0" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">SMILES</text><text x="924.0" y="169.0" font-size="12" fill="#D7DCE2" font-weight="normal" text-anchor="middle">7 metrics</text><path d="M850,155 L870,155" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><rect x="204" y="300" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#C9CED6" stroke-width="1.2"/><text x="284.0" y="326.0" font-size="15" fill="#1F2933" font-weight="bold" text-anchor="middle">DFT Hessian</text><text x="284.0" y="344.0" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle">shipped with QM9S</text><rect x="392" y="300" width="300" height="60" rx="8" fill="#FDF3E3" stroke="#E3B77A" stroke-width="1.2"/><text x="542.0" y="326.0" font-size="15" fill="#1F2933" font-weight="bold" text-anchor="middle">ORCA PED Analyzer</text><text x="542.0" y="344.0" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="middle">mode label for 97% of peaks</text><path d="M364,330 L390,330" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#ah)"/><path d="M542,300 L542,252" fill="none" stroke="#C4420E" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="552" y="280" font-size="11" fill="#C4420E" font-weight="normal" text-anchor="start" font-style="italic">only B_modes_on</text><text x="24" y="400" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="start">Everything except the text is identical across arms: molecules, splits, model, LoRA settings, batch order, decoding, metrics.</text><text x="24" y="418" font-size="12" fill="#5F6B7A" font-weight="normal" text-anchor="start">10,000 training molecules (30,000 prompts: IR, Raman, IR+Raman); 1,000 test molecules from SpectraLLM's own test set.</text></svg>